paths:
  raw_dir: data/raw
  processed_dir: data/processed
  panel_filename: panel_data.csv
  figures_dir: outputs/figures
  metrics_dir: outputs/metrics

raw_files:
  fc_15_24: FC_15_24_male_players.csv
  fc_25: FC_25_male_players.csv
  fc_26: ea_fc26_players.csv

cohort:
  max_scout_age: 21
  max_scout_overall: 75
  elite_threshold: 82
  horizon_years: 4
  min_version: 15
  max_version: 26
  # Earliest cutoff with H=4 where training data (v <= cutoff - 4) spans at least 2 editions (15-16)
  rolling_cutoffs: [20, 21, 22]
  final_train_max_version: 22
  predict_version: 26

evaluation:
  top_k_overall: [15, 30, 50]
  top_k_per_position: 5
  random_state: 42

features:
  # 34 outfield attributes available in all editions (FIFA 15 to FC 26)
  # overall is excluded to avoid using EA's composite score directly; composure starts in FIFA 17
  skill_cols:
    - pace
    - shooting
    - passing
    - dribbling
    - defending
    - physic
    - attacking_crossing
    - attacking_finishing
    - attacking_heading_accuracy
    - attacking_short_passing
    - attacking_volleys
    - skill_dribbling
    - skill_curve
    - skill_fk_accuracy
    - skill_long_passing
    - skill_ball_control
    - movement_acceleration
    - movement_sprint_speed
    - movement_agility
    - movement_reactions
    - movement_balance
    - power_shot_power
    - power_jumping
    - power_stamina
    - power_strength
    - power_long_shots
    - mentality_aggression
    - mentality_interceptions
    - mentality_positioning
    - mentality_vision
    - mentality_penalties
    - defending_marking_awareness
    - defending_standing_tackle
    - defending_sliding_tackle

  trajectory_cols:
    - pace
    - shooting
    - passing
    - dribbling
    - defending
    - physic
    - skill_ball_control
    - movement_reactions
    - mentality_vision
    - power_stamina
    - mean_all_skills

  peer_z_cols:
    - mean_all_skills
    - top5_skill_mean
    - movement_reactions
    - skill_ball_control
    - pace
    - dribbling
    - passing
    - defending
    - physic
